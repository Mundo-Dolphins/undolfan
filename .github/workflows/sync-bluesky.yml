name: Sync Bluesky

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization mode
        type: choice
        required: true
        default: normal
        options:
          - normal
          - full
      dry_run:
        description: Run without writing or committing
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: write
  deployments: write
  pull-requests: write
  statuses: write

concurrency:
  group: bluesky-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HUGO_BASEURL: ${{ vars.HUGO_BASEURL || 'https://mundodolphins.es/undolfan/' }}
      SYNC_BRANCH: sync/bluesky-content
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Find existing sync pull request
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_url="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json url --jq '.[0].url')"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Continue existing sync branch
        if: steps.existing_pr.outputs.url != ''
        run: |
          git fetch origin "$SYNC_BRANCH"
          git checkout -B "$SYNC_BRANCH" FETCH_HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - name: Test
        run: go test ./...
      - name: Sync
        run: |
          args=""
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            args="$args --full"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          go run ./cmd/bluesky-importer sync $args
      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: hugo --minify
      - name: Create or update pull request
        id: pull_request
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add content data
          git commit -m "Sync Bluesky content"
          git push --force origin HEAD:"$SYNC_BRANCH"
          head_sha="$(git rev-parse HEAD)"

          gh api "repos/${{ github.repository }}/statuses/$head_sha" \
            -f state=success \
            -f context="Validate PR / validate" \
            -f description="Go tests and Hugo build passed in Sync Bluesky" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          deployment_id="$(gh api "repos/${{ github.repository }}/deployments" \
            -f ref="$head_sha" \
            -f environment="pr-preview" \
            -F auto_merge=false \
            -f description="Validated Hugo build for PR" \
            --jq ".id")"
          gh api "repos/${{ github.repository }}/deployments/$deployment_id/statuses" \
            -f state=success \
            -f environment="pr-preview" \
            -f description="Go tests and Hugo build passed" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          pr_url="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "Sync Bluesky content" \
              --body "Automated Bluesky content sync.")"
          fi
          gh pr merge "$pr_url" --auto --squash
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "cloudflare/**"
      - "cmd/**"
      - "config/**"
      - "content/**"
      - "data/**"
      - "internal/**"
      - "layouts/**"
      - "static/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: pr-preview
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      HUGO_BASEURL: ${{ vars.HUGO_BASEURL || 'https://mundodolphins.es/undolfan/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - name: Test
        run: go test ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cloudflare/sync-trigger/.node-version
      - name: Test Cloudflare worker
        run: npm test
        working-directory: cloudflare/sync-trigger
      - name: Build
        run: hugo --minify
